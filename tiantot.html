<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TIAN SPOTIPAY</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0f0f1a;
      color:white;
    }

    header{
      width:100%;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:fixed;
      top:0;
      left:0;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(10px);
      z-index:1000;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#ff4ecd;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:25px;
      transition:0.3s;
    }

    nav a:hover{
      color:#ff4ecd;
    }

    .hero{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:0 10%;
      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1400&auto=format&fit=crop')
        center/cover;
    }

    .hero-content h1{
      font-size:65px;
      margin-bottom:20px;
    }

    .hero-content span{
      color:#ff4ecd;
    }

    .hero-content p{
      font-size:18px;
      max-width:700px;
      margin:auto;
      margin-bottom:30px;
      line-height:1.6;
    }

    .btn{
      display:inline-block;
      padding:14px 35px;
      background:#ff4ecd;
      color:white;
      text-decoration:none;
      border-radius:50px;
      transition:0.3s;
      font-weight:bold;
    }

    .btn:hover{
      background:#ff1fb3;
      transform:scale(1.05);
    }

    .section{
      padding:100px 8%;
    }

    .title{
      text-align:center;
      font-size:40px;
      margin-bottom:50px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:#1b1b2f;
      border-radius:20px;
      overflow:hidden;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-10px);
      box-shadow:0 10px 30px rgba(255,78,205,0.3);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
    }

    .card-content h3{
      margin-bottom:10px;
      color:#ff4ecd;
    }

    footer{
      text-align:center;
      padding:25px;
      background:#111;
      margin-top:50px;
      color:#aaa;
    }

    @media(max-width:768px){
      .hero-content h1{
        font-size:42px;
      }

      nav{
        display:none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">TIAN SPOTIPAY</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Album</a>
      <a href="#">Artist</a>
      <a href="#">Event</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Feel The <span>Music</span></h1>

      <p>
        DISINI CUMA ADA LAGU ORANG STRESS!!
      </p>

      <a href="#" class="btn">Mulai Dengarkan</a>
    </div>
  </section>

  <section class="section">
    <h2 class="title">MUSIC TREND</h2>

    <div class="cards">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1000&auto=format&fit=crop">

        <div class="card-content">
          <h3>ALBUM LAGU GALAU</h3>
        
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1501612780327-45045538702b?q=80&w=1000&auto=format&fit=crop">

        <div class="card-content">
          <h3>BREAKBEAT ALBUM AREA</h3>
          
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1499364615650-ec38552f4f34?q=80&w=1000&auto=format&fit=crop">

        <div class="card-content">
          <h3>SOUND HOREG ALBUM</h3>
        
        </div>
      </div>

    </div>
  </section>

  <footer>
    © 2026 MusicWave - All Rights Reserved
  </footer>

</body>
</html>
